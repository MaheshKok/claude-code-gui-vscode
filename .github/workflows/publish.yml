name: CI - Build & Release

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    pull_request:
        branches:
            - main

jobs:
    # Job 1: Build and Test (runs on pushes and PRs)
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run typecheck

            - name: Build extension
              run: npm run build

            - name: Package extension
              run: npx vsce package

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-vsix
                  path: "*.vsix"

    # Job 2: Release (only on version tag push)
    release:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate tag matches package.json
              id: version-check
              run: |
                  TAG_VERSION="${GITHUB_REF#refs/tags/v}"
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")

                  echo "Tag version: $TAG_VERSION"
                  echo "Package version: $PACKAGE_VERSION"

                  if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "Tag version does not match package.json version."
                    exit 1
                  fi

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build extension
              run: npm run build

            - name: Package extension
              run: npx vsce package

            - name: Publish to VS Code Marketplace
              run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Publish to Open VSX
              run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Create GitHub Release and upload VSIX
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true
                  files: "*.vsix"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
