name: CI - Build & Release

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    # Job 1: Build and Test (runs on pushes and PRs)
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run linter
              run: npm run lint

            - name: Run type check
              run: npm run typecheck

            - name: Build extension
              run: npm run build

            - name: Package extension
              run: npx vsce package

            - name: Upload VSIX artifact
              uses: actions/upload-artifact@v4
              with:
                  name: extension-vsix
                  path: "*.vsix"

    # Job 2: Release (only on push to main with version change)
    release:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Check if version changed
              id: version-check
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")
                  echo "Current version: $CURRENT_VERSION"

                  git checkout HEAD~1 -- package.json 2>/dev/null || true
                  PREVIOUS_VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
                  git checkout HEAD -- package.json

                  echo "Previous version: $PREVIOUS_VERSION"

                  if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
                    echo "version_changed=true" >> $GITHUB_OUTPUT
                    echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  else
                    echo "version_changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Setup Node.js
              if: steps.version-check.outputs.version_changed == 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              if: steps.version-check.outputs.version_changed == 'true'
              run: npm ci

            - name: Build extension
              if: steps.version-check.outputs.version_changed == 'true'
              run: npm run build

            - name: Package extension
              if: steps.version-check.outputs.version_changed == 'true'
              run: npx vsce package

            - name: Publish to VS Code Marketplace
              if: steps.version-check.outputs.version_changed == 'true'
              run: npx vsce publish -p ${{ secrets.VSCE_PAT }}
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            - name: Publish to Open VSX
              if: steps.version-check.outputs.version_changed == 'true'
              run: npx ovsx publish -p ${{ secrets.OVSX_PAT }}
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}

            - name: Create git tag
              if: steps.version-check.outputs.version_changed == 'true'
              run: |
                  VERSION="v${{ steps.version-check.outputs.new_version }}"
                  if git rev-parse "$VERSION" >/dev/null 2>&1; then
                    echo "Tag $VERSION already exists, skipping tag creation."
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "$VERSION"
                  git push origin "$VERSION"

            - name: Create GitHub Release and upload VSIX
              if: steps.version-check.outputs.version_changed == 'true'
              uses: softprops/action-gh-release@v1
              with:
                  generate_release_notes: true
                  tag_name: v${{ steps.version-check.outputs.new_version }}
                  files: "*.vsix"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
